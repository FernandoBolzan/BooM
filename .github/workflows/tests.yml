name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            desktop-file-utils \
            gir1.2-ayatanaappindicator3-0.1 \
            gir1.2-gtk-3.0 \
            python3-gi \
            python3-yaml
      - name: Compile Python files
        run: /usr/bin/python3 -m py_compile boom.py boom_games.py boom_performance.py boom_local_ai.py boom_disk_benchmark.py boom_sysbench.py boom_test_workflow.py tests/test_boom.py tests/test_games.py tests/test_local_ai.py tests/test_disk_benchmark.py tests/test_sysbench.py
      - name: Run tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Check CLI and snapshot
        run: |
          /usr/bin/python3 boom.py --version
          /usr/bin/python3 boom.py --snapshot > /tmp/boom-snapshot.json
          /usr/bin/python3 -c 'import json; json.load(open("/tmp/boom-snapshot.json", encoding="utf-8"))'
      - name: Validate autostart desktop entry
        run: |
          config_home="$(mktemp -d)"
          trap 'rm -rf "$config_home"' EXIT
          XDG_CONFIG_HOME="$config_home" /usr/bin/python3 boom.py --enable-autostart
          desktop-file-validate "$config_home/autostart/boom-monitor.desktop"
          XDG_CONFIG_HOME="$config_home" /usr/bin/python3 boom.py --disable-autostart
      - name: Validate application launcher installer
        run: |
          data_home="$(mktemp -d)"
          trap 'rm -rf "$data_home"' EXIT
          XDG_DATA_HOME="$data_home" ./install-linux.sh
          desktop-file-validate "$data_home/applications/com.boom.SystemMonitor.desktop"
          test -s "$data_home/icons/hicolor/scalable/apps/com.boom.SystemMonitor.svg"
          XDG_DATA_HOME="$data_home" ./install-linux.sh --uninstall
          test ! -e "$data_home/applications/com.boom.SystemMonitor.desktop"
